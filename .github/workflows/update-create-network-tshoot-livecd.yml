name: Update create-network-tshoot-livecd package version

on:
  schedule:
    # Check for upstream version changes daily at 07:00 UTC
    - cron: '0 7 * * *'
  workflow_dispatch:
    # Allow manual trigger

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout obs-network-tools
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest upstream release and extract version
        id: get_version
        run: |
          LATEST_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ciroiriarte/network-tshoot-livecd/releases/latest")

          TAG_NAME=$(echo "${LATEST_JSON}" | python3 -c \
            "import sys, json; print(json.load(sys.stdin)['tag_name'])")
          # Strip leading 'v' from tag (v1.1.0 -> 1.1.0)
          NEW_VERSION="${TAG_NAME#v}"

          if [[ -z "${NEW_VERSION}" ]]; then
            echo "ERROR: Could not determine latest version from GitHub releases" >&2
            exit 1
          fi

          # Current packaged version comes from the _service version param
          CURRENT_VERSION=$(grep -oE '<param name="version">[^<]+</param>' \
            packages/create-network-tshoot-livecd/_service \
            | head -1 | sed -E 's/.*>([^<]+)<.*/\1/')

          echo "upstream_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Upstream: ${NEW_VERSION} | Packaged: ${CURRENT_VERSION}"

      - name: Skip if version unchanged
        if: steps.get_version.outputs.upstream_version == steps.get_version.outputs.current_version
        run: echo "Version is already ${{ steps.get_version.outputs.current_version }}. Nothing to do."

      - name: Update _service version and revision
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.upstream_version }}
          CURRENT_VERSION: ${{ steps.get_version.outputs.current_version }}
        run: |
          S=packages/create-network-tshoot-livecd/_service
          sed -i "s|<param name=\"version\">${CURRENT_VERSION}</param>|<param name=\"version\">${NEW_VERSION}</param>|" "$S"
          sed -i "s|<param name=\"revision\">v${CURRENT_VERSION}</param>|<param name=\"revision\">v${NEW_VERSION}</param>|" "$S"

      - name: Update debian.changelog
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.upstream_version }}
          CURRENT_VERSION: ${{ steps.get_version.outputs.current_version }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ciroiriarte/network-tshoot-livecd/compare/v${CURRENT_VERSION}...v${NEW_VERSION}" \
            -o /tmp/compare.json 2>/dev/null || echo '{"commits":[]}' > /tmp/compare.json

          DATE_DEB=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")
          DEB_ENTRIES=$(python3 -c "
          import json
          data = json.load(open('/tmp/compare.json'))
          commits = data.get('commits', [])
          lines = ['  * ' + c['commit']['message'].split('\n')[0].strip() for c in commits]
          print('\n'.join(lines) if lines else '  * Update to ${NEW_VERSION}')
          ")

          CL=packages/create-network-tshoot-livecd/debian.changelog
          TMPFILE=$(mktemp)
          {
            echo "create-network-tshoot-livecd (${NEW_VERSION}-1) unstable; urgency=medium"
            echo ""
            echo "${DEB_ENTRIES}"
            echo ""
            echo " -- Ciro Iriarte <ciro.iriarte+software@gmail.com>  ${DATE_DEB}"
            echo ""
            cat "$CL"
          } > "${TMPFILE}"
          mv "${TMPFILE}" "$CL"

      - name: Commit changes to obs-network-tools
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.upstream_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/create-network-tshoot-livecd/_service \
                  packages/create-network-tshoot-livecd/debian.changelog
          git commit -m "create-network-tshoot-livecd: update to ${NEW_VERSION}"
          git pull --rebase
          git push

      - name: Install osc
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        run: sudo apt-get install -y osc

      - name: Configure osc credentials
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        env:
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          mkdir -p ~/.config/osc
          {
            echo "[general]"
            echo "apiurl = https://api.opensuse.org"
            echo ""
            echo "[https://api.opensuse.org]"
            echo "user = ciriarte"
            echo "pass = ${OBS_PASSWORD}"
          } > ~/.config/osc/oscrc
          chmod 600 ~/.config/osc/oscrc

      - name: Push updated package to OBS
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.upstream_version }}
        run: |
          osc co home:ciriarte:network-tools create-network-tshoot-livecd
          cp packages/create-network-tshoot-livecd/_service \
             packages/create-network-tshoot-livecd/debian.changelog \
             home:ciriarte:network-tools/create-network-tshoot-livecd/
          cd home:ciriarte:network-tools/create-network-tshoot-livecd
          osc commit -m "Update create-network-tshoot-livecd to ${NEW_VERSION}"
