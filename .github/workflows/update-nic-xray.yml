name: Update nic-xray package version

on:
  schedule:
    # Check for upstream version changes daily at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger
    inputs:
      sync:
        description: Send every packaging file to OBS even when the version is unchanged (after a spec/debian change)
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout obs-network-tools
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch latest upstream release and extract version
        id: get_version
        env:
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          LATEST_JSON=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ciroiriarte/nic-xray/releases/latest")

          TAG_NAME=$(echo "${LATEST_JSON}" | python3 -c \
            "import sys, json; print(json.load(sys.stdin)['tag_name'])")
          # Strip leading 'v' from tag (v2.1 -> 2.1)
          NEW_VERSION="${TAG_NAME#v}"

          if [[ -z "${NEW_VERSION}" ]]; then
            echo "ERROR: Could not determine latest version from GitHub releases" >&2
            exit 1
          fi

          # Read current packaged version from top of changes file
          CURRENT_VERSION=$(grep -E ' - [0-9]' packages/nic-xray/nic-xray.changes \
            | head -1 | sed 's/.*- \([0-9][^ ]*\)-[0-9]*/\1/')

          # Version on OBS: it lags git when an upload failed after the git push
          OBS_VERSION=$(curl -fsS --retry 3 --retry-all-errors -K - \
            "https://api.opensuse.org/source/home:ciriarte:network-tools/nic-xray/nic-xray.changes" <<<"user = \"ciriarte:${OBS_PASSWORD}\"" \
            | grep -E ' - [0-9]' | head -1 | sed 's/.*- \([0-9][^ ]*\)-[0-9]*/\1/')
          if [[ -z "${OBS_VERSION}" ]]; then
            echo "::warning::Could not read the nic-xray version on OBS; comparing against git instead"
            OBS_VERSION="${CURRENT_VERSION}"
          fi

          echo "upstream_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "current_version=${CURRENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "obs_version=${OBS_VERSION}" >> "$GITHUB_OUTPUT"
          # OBS gets the package when it is behind upstream, or on request (packaging-only changes)
          if [[ "${NEW_VERSION}" != "${OBS_VERSION}" || "${{ inputs.sync || false }}" == "true" ]]; then
            echo "obs_push=true" >> "$GITHUB_OUTPUT"
          else
            echo "obs_push=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Upstream: ${NEW_VERSION} | Packaged: ${CURRENT_VERSION} | OBS: ${OBS_VERSION}"

      - name: Report git already at upstream version
        if: steps.get_version.outputs.upstream_version == steps.get_version.outputs.current_version
        run: |
          echo "Version is already ${{ steps.get_version.outputs.current_version }} in git (OBS: ${{ steps.get_version.outputs.obs_version }})."

      - name: Update _service version and revision
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.upstream_version }}
          CURRENT_VERSION: ${{ steps.get_version.outputs.current_version }}
        run: |
          sed -i "s|<param name=\"version\">${CURRENT_VERSION}</param>|<param name=\"version\">${NEW_VERSION}</param>|" \
            packages/nic-xray/_service
          sed -i "s|<param name=\"revision\">v${CURRENT_VERSION}</param>|<param name=\"revision\">v${NEW_VERSION}</param>|" \
            packages/nic-xray/_service

      - name: Update changelogs
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.upstream_version }}
          CURRENT_VERSION: ${{ steps.get_version.outputs.current_version }}
        run: |
          # Fetch commit messages between the two versions
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/ciroiriarte/nic-xray/compare/v${CURRENT_VERSION}...v${NEW_VERSION}" \
            -o /tmp/compare.json 2>/dev/null || echo '{"commits":[]}' > /tmp/compare.json

          DATE_RPM=$(date -u "+%a %b %d %Y")
          DATE_DEB=$(date -u "+%a, %d %b %Y %H:%M:%S +0000")

          RPM_ENTRIES=$(python3 -c "
          import json
          data = json.load(open('/tmp/compare.json'))
          commits = data.get('commits', [])
          lines = ['- ' + c['commit']['message'].split('\n')[0].strip() for c in commits]
          print('\n'.join(lines) if lines else '- Update to ${NEW_VERSION}')
          ")

          DEB_ENTRIES=$(python3 -c "
          import json
          data = json.load(open('/tmp/compare.json'))
          commits = data.get('commits', [])
          lines = ['  * ' + c['commit']['message'].split('\n')[0].strip() for c in commits]
          print('\n'.join(lines) if lines else '  * Update to ${NEW_VERSION}')
          ")

          TMPFILE=$(mktemp)
          {
            echo "-------------------------------------------------------------------"
            echo "${DATE_RPM} Ciro Iriarte <ciro.iriarte+software@gmail.com> - ${NEW_VERSION}-1"
            echo ""
            echo "${RPM_ENTRIES}"
            echo ""
            cat packages/nic-xray/nic-xray.changes
          } > "${TMPFILE}"
          mv "${TMPFILE}" packages/nic-xray/nic-xray.changes

          TMPFILE=$(mktemp)
          {
            echo "nic-xray (${NEW_VERSION}-1) unstable; urgency=medium"
            echo ""
            echo "${DEB_ENTRIES}"
            echo ""
            echo " -- Ciro Iriarte <ciro.iriarte+software@gmail.com>  ${DATE_DEB}"
            echo ""
            cat packages/nic-xray/debian.changelog
          } > "${TMPFILE}"
          mv "${TMPFILE}" packages/nic-xray/debian.changelog

      - name: Commit changes to obs-network-tools
        if: steps.get_version.outputs.upstream_version != steps.get_version.outputs.current_version
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.upstream_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/nic-xray/_service \
                  packages/nic-xray/nic-xray.changes \
                  packages/nic-xray/debian.changelog
          git commit -m "nic-xray: update to ${NEW_VERSION}"
          git pull --rebase
          git push

      - name: Install osc
        if: steps.get_version.outputs.obs_push == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y osc

      - name: Configure osc credentials
        if: steps.get_version.outputs.obs_push == 'true'
        env:
          OBS_PASSWORD: ${{ secrets.OBS_PASSWORD }}
        run: |
          mkdir -p ~/.config/osc
          {
            echo "[general]"
            echo "apiurl = https://api.opensuse.org"
            echo ""
            echo "[https://api.opensuse.org]"
            echo "user = ciriarte"
            echo "pass = ${OBS_PASSWORD}"
          } > ~/.config/osc/oscrc
          chmod 600 ~/.config/osc/oscrc

      - name: Push the package to OBS
        if: steps.get_version.outputs.obs_push == 'true'
        env:
          NEW_VERSION: ${{ steps.get_version.outputs.upstream_version }}
          OBS_VERSION: ${{ steps.get_version.outputs.obs_version }}
        run: |
          if [[ "${NEW_VERSION}" == "${OBS_VERSION}" ]]; then
            MSG="Sync nic-xray packaging (${NEW_VERSION})"
          else
            MSG="Update nic-xray to ${NEW_VERSION}"
          fi
          PKG_DIR=home:ciriarte:network-tools/nic-xray
          # Mirror packages/nic-xray exactly: every packaging change reaches OBS, stale files go away.
          # Each attempt starts from a fresh checkout, so a commit that landed despite an error is a no-op.
          push() {
            rm -rf "${PKG_DIR}" &&
              osc co home:ciriarte:network-tools nic-xray &&
              find "${PKG_DIR}" -maxdepth 1 -type f -delete &&
              cp -a packages/nic-xray/. "${PKG_DIR}/" &&
              (cd "${PKG_DIR}" && osc addremove && osc commit -m "${MSG}")
          }
          # OBS returns transient 5xx errors; try 3 times before failing the run
          for i in 1 2 3; do
            push && exit 0
            echo "::warning::OBS push attempt $i failed"
            [[ $i -lt 3 ]] && sleep 60
          done
          exit 1
